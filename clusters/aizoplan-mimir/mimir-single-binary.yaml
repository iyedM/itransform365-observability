# Mimir single-binary deployment — plain manifests, not Helm.
# Replaces the mimir-distributed chart release (which only supports the
# distributed/microservices layout, has no monolithic switch, and
# requires Kafka in this chart version).
#
# This runs one Mimir process with `-target=all`, the binary's own
# built-in single-process mode. No ring complexity, no Kafka, no
# separate ingester/distributor/compactor pods.
#
# Reuses: same S3 bucket (tempo-bucket, temporary), same storage class,
# same Ingress/TLS/basic-auth already working at mimir.itransform365.com.

apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: mimir
data:
  mimir.yaml: |
    multitenancy_enabled: true

    target: all

    server:
      http_listen_port: 8080
      grpc_listen_port: 9095

    activity_tracker:
      filepath: /data/active-query-tracker/activity.log

    blocks_storage:
      backend: s3
      s3:
        endpoint: s3.rbx.io.cloud.ovh.net
        region: rbx
        bucket_name: tempo-bucket
        access_key_id: a6c30c8373054d3e9938216b6ad00577
        secret_access_key: 014d2e20ff314dc8a5924d9763b60504
        insecure: false
      tsdb:
        dir: /data/tsdb
      bucket_store:
        sync_dir: /data/tsdb-sync

    compactor:
      data_dir: /data/compactor
      sharding_ring:
        kvstore:
          store: inmemory

    alertmanager_storage:
      backend: s3
      storage_prefix: mimiralertmanager
      s3:
        endpoint: s3.rbx.io.cloud.ovh.net
        region: rbx
        bucket_name: tempo-bucket
        access_key_id: a6c30c8373054d3e9938216b6ad00577
        secret_access_key: 014d2e20ff314dc8a5924d9763b60504
        insecure: false

    ruler_storage:
      backend: s3
      storage_prefix: mimirruler
      s3:
        endpoint: s3.rbx.io.cloud.ovh.net
        region: rbx
        bucket_name: tempo-bucket
        access_key_id: a6c30c8373054d3e9938216b6ad00577
        secret_access_key: 014d2e20ff314dc8a5924d9763b60504
        insecure: false

    # Single-process mode: replication factor 1, no ring coordination
    # needed across multiple ingester pods since there's only one process.
    ingester:
      ring:
        replication_factor: 1
        kvstore:
          store: inmemory

    distributor:
      ring:
        kvstore:
          store: inmemory

    store_gateway:
      sharding_ring:
        replication_factor: 1
        kvstore:
          store: inmemory

    ruler:
      enable_api: true
      ring:
        kvstore:
          store: inmemory

    alertmanager:
      data_dir: /data/alertmanager
      enable_api: true
      external_url: /alertmanager
      sharding_ring:
        kvstore:
          store: inmemory

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mimir-data
  namespace: mimir
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: csi-cinder-high-speed-gen2
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: mimir
  labels:
    app: mimir
spec:
  replicas: 1
  strategy:
    type: Recreate  # avoids two processes fighting over the same PVC during rollout
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
    spec:
      initContainers:
        - name: init-data-dirs
          image: busybox:1.36
          command:
            - sh
            - -c
            - "mkdir -p /data/active-query-tracker /data/tsdb /data/tsdb-sync /data/compactor /data/alertmanager"
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: mimir
          image: grafana/mimir:3.2.0
          args:
            - "-config.file=/etc/mimir/mimir.yaml"
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9095
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: mimir-config
        - name: data
          persistentVolumeClaim:
            claimName: mimir-data

---
apiVersion: v1
kind: Service
metadata:
  name: mimir-gateway
  namespace: mimir
spec:
  selector:
    app: mimir
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: grpc
      port: 9095
      targetPort: 9095
