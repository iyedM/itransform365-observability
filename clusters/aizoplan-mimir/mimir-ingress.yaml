apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mimir-push
  namespace: mimir
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: mimir-push-auth
    nginx.ingress.kubernetes.io/auth-realm: "Mimir push authentication required"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mimir.itransform365.com
      secretName: mimir-tls-cert
  rules:
    - host: mimir.itransform365.com
      http:
        paths:
          - path: /api/v1/push
            pathType: Prefix
            backend:
              service:
                name: mimir-gateway
                port:
                  number: 80
