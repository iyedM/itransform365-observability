tempo:
  storage:
    trace:
      backend: s3
      s3:
        bucket: tempo-traces
        endpoint: minio.observability.svc.cluster.local:9000
        access_key: minioadmin
        secret_key: minioadmin123
        insecure: true
      block:
        version: vParquet4
  retention: 168h
  ingester:
    max_block_duration: 30m
    trace_idle_period: 30s
